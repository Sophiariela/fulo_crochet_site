{% extends "public/base.html" %}

{% block title %}Nova Senha | FULÔ{% endblock %}

{% block extra_css %}
<style>
    .auth-container { max-width: 450px; margin: 100px auto; padding: 40px; background: #fff; border: 1px solid var(--border); }
    .auth-container h2 { font-size: 2.5rem; margin-bottom: 30px; text-align: center; }
    
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-size: 0.75rem; text-transform: uppercase; margin-bottom: 8px; color: var(--muted); }
    .form-group input { width: 100%; padding: 14px; border: 1px solid var(--border); font-family: inherit; font-size: 1rem; outline: none; transition: var(--transition); }
    .form-group input:focus { border-color: var(--text); }
</style>
{% endblock %}

{% block content %}
<section class="container">
    <div class="auth-container fade-in">
        <h2>Nova Senha.</h2>
        <form method="POST">
            <div class="form-group">
                <label>Nova Senha</label>
                <input type="password" name="password" required placeholder="********">
            </div>
            <button type="submit" class="btn btn-full" style="background: var(--text); color: #fff;">Alterar Senha</button>
        </form>
    </div>
</section>
{% endblock %}
