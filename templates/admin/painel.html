<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Painel | Fulô</title>
    <style>
        body { font-family: sans-serif; background: #f5f0eb; margin: 0; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        h1 { color: #3d2b1f; }
        .btn { padding: 10px 20px; border-radius: 8px; text-decoration: none; font-size: 0.9rem; }
        .btn-add { background: #3d2b1f; color: white; }
        .btn-logout { background: #ddd; color: #333; }
        .btn-delete { background: #e74c3c; color: white; font-size: 0.8rem; padding: 6px 12px; }
        table { width: 100%; background: white; border-radius: 16px; border-collapse: collapse; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        th { background: #3d2b1f; color: white; padding: 14px; text-align: left; }
        td { padding: 12px 14px; border-bottom: 1px solid #f0e8e0; }
        tr:last-child td { border-bottom: none; }
        th:first-child { border-radius: 16px 0 0 0; }
        th:last-child { border-radius: 0 16px 0 0; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Painel Fulô</h1>
        <div>
            <a href="{{ url_for('admin.adicionar') }}" class="btn btn-add">+ Adicionar Produto</a>
            <a href="{{ url_for('auth.logout') }}" class="btn btn-logout">Sair</a>
        </div>
    </div>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Preço</th>
                <th>Categoria</th>
                <th>Ação</th>
            </tr>
        </thead>
        <tbody>
            {% for p in produtos %}
            <tr>
                <td>{{ p.id }}</td>
                <td>{{ p.nome }}</td>
                <td>R$ {{ "%.2f"|format(p.preco) }}</td>
                <td>{{ p.categoria }}</td>
                <td><a href="{{ url_for('admin.deletar', id=p.id) }}" class="btn btn-delete" onclick="return confirm('Deletar {{ p.nome }}?')">Deletar</a></td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
