<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Sucesso | Fulô</title>
    <style>
        body { font-family: sans-serif; background: #f5f0eb; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: white; padding: 40px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 450px; text-align: center; }
        h1 { color: #27ae60; font-size: 3rem; margin-bottom: 10px; }
        h2 { color: #3d2b1f; }
        p { color: #666; line-height: 1.6; }
        .btn-home { display: inline-block; background: #3d2b1f; color: white; text-decoration: none; padding: 12px 24px; border-radius: 8px; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="box">
        <h1>✔</h1>
        <h2>Pedido Recebido!</h2>
        <p>Obrigado por comprar na Fulô. Seu pedido <strong>#{{ order_id }}</strong> foi registrado e estamos aguardando a confirmação do pagamento.</p>
        <p>Você receberá atualizações por email.</p>
        <a href="{{ url_for('public.index') }}" class="btn-home">Voltar para a Loja</a>
    </div>
</body>
</html>
