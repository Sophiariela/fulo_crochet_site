<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Admin | Fulô</title>
    <style>
        body { font-family: sans-serif; background: #f5f0eb; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: white; padding: 40px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 300px; }
        h2 { text-align: center; color: #3d2b1f; margin-bottom: 24px; }
        input { width: 100%; padding: 10px; margin-bottom: 16px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #3d2b1f; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 1rem; }
        .erro { color: red; text-align: center; margin-bottom: 12px; }
    </style>
</head>
<body>
    <div class="box">
        <h2>🌸 Fulô Admin</h2>
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <p class="erro">{{ messages[0] }}</p>
            {% endif %}
        {% endwith %}
        <form method="POST">
            <input type="password" name="senha" placeholder="Senha" required>
            <button type="submit">Entrar</button>
        </form>
    </div>
</body>
</html>
